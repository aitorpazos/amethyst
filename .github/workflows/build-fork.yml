name: Build Fork APK

on:
  workflow_dispatch:
  push:
    branches: [fork/combined]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build FDroid Release APK
        run: ./gradlew assembleFdroidRelease --no-daemon

      - name: Upload FDroid Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-XMR-FDroid-Release-APK
          path: amethyst/build/outputs/apk/fdroid/release/*.apk

      - name: Build FDroid Debug APK
        run: ./gradlew assembleFdroidDebug --no-daemon

      - name: Upload FDroid Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-XMR-FDroid-Debug-APK
          path: amethyst/build/outputs/apk/fdroid/debug/*.apk
